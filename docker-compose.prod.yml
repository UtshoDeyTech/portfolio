version: '3.8'

services:
  backend:
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=portfolio_backend.settings
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn portfolio_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    restart: unless-stopped

  frontend:
    environment:
      - NODE_ENV=production
    command: npm run preview -- --host 0.0.0.0 --port 4321
    restart: unless-stopped

  db:
    restart: unless-stopped
